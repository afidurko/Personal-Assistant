<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Card Battle — detect → 3D spawn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ar-scene.css" />
</head>
<body>
  <!-- Phone AR viewport: camera desk + world-anchored overlays -->
  <div id="ar-view" class="ar-view mode-setup">
    <img class="ar-camera" src="assets/ar/ar-desk-bg.png" alt="" />

    <!-- Green battle arena on the table (like the reference stadium disk) -->
    <div class="arena" id="arena" aria-hidden="true">
      <img src="assets/ar/arena-disk.png" alt="" />
    </div>

    <!-- Team strip (You / Opponent) — frosted panel like reference -->
    <aside class="panel panel-team" id="panel-team">
      <div class="team-row">
        <span>You</span>
        <div class="pips" data-team="you">
          <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i>
        </div>
      </div>
      <div class="team-row">
        <span>Opponent</span>
        <div class="pips" data-team="opp">
          <i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </aside>

    <!-- Turn / history log -->
    <aside class="panel panel-log" id="panel-log">
      <div class="log-title" id="log-title">WAITING FOR FIRST TURN</div>
      <div class="log-body" id="log-body">Actions will appear here.</div>
    </aside>

    <!-- Setup instructions -->
    <aside class="panel panel-setup" id="panel-setup">
      <div class="setup-step">SETUP <b id="setup-step">1 / 3</b></div>
      <div id="setup-copy">Place a Basic creature in Active. Press + to scan.</div>
    </aside>

    <aside class="panel panel-wait" id="panel-wait" hidden>Waiting…</aside>

    <!-- Table zones with corner brackets -->
    <div class="zone zone-active" id="zone-active" data-slot="active">
      <div class="brackets" aria-hidden="true">
        <span class="c tl"></span><span class="c tr"></span>
        <span class="c bl"></span><span class="c br"></span>
      </div>
      <div class="zone-label">ACTIVE</div>
      <img class="physical-card" id="card-active" src="assets/ar/physical-card-volt.png" alt="Active card" />
      <div class="holo-card" id="holo-active" hidden>
        <img src="assets/ar/physical-card-volt.png" alt="" />
      </div>
      <div class="active-hp" id="active-hp" hidden>ACTIVE · <b>90 / 90 HP</b></div>
    </div>

    <div class="zone zone-deck" id="zone-deck">
      <div class="brackets dim" aria-hidden="true">
        <span class="c tl"></span><span class="c tr"></span>
        <span class="c bl"></span><span class="c br"></span>
      </div>
      <div class="zone-label">DECK</div>
      <div class="deck-stack"></div>
    </div>

    <div class="zone zone-opp" id="zone-opp" data-slot="opponent">
      <div class="brackets dim" aria-hidden="true">
        <span class="c tl"></span><span class="c tr"></span>
        <span class="c bl"></span><span class="c br"></span>
      </div>
      <div class="zone-label">OPPONENT</div>
      <img class="physical-card" id="card-opp" src="assets/ar/physical-card-ember.png" alt="Opponent card" hidden />
      <div class="holo-card" id="holo-opp" hidden>
        <img src="assets/ar/physical-card-ember.png" alt="" />
      </div>
    </div>

    <!-- 3D creatures standing on arena -->
    <div class="fighter fighter-you" id="fighter-you" hidden>
      <img src="assets/ar/creature-volt-wisp-v2.png" alt="Volt Wisp" />
      <div class="hp-bar">
        <div class="hp-fill" id="hp-you-fill"></div>
        <span id="hp-you-text">HP 90 / 90</span>
      </div>
    </div>
    <div class="fighter fighter-opp" id="fighter-opp" hidden>
      <img src="assets/ar/creature-ember-drake.png" alt="Ember Drake" />
      <div class="hp-bar">
        <div class="hp-fill" id="hp-opp-fill"></div>
        <span id="hp-opp-text">HP 80 / 80</span>
      </div>
    </div>

    <!-- Floating move buttons (right of active card) -->
    <div class="moves" id="moves" hidden>
      <button type="button" data-move="spark-jab">Spark Jab</button>
      <button type="button" data-move="arc-combo">Arc Combo</button>
      <button type="button" data-move="retreat">Retreat</button>
    </div>

    <!-- + scan control -->
    <button type="button" class="scan-btn" id="scan-btn" aria-label="Scan card">+</button>

    <!-- Bottom action banner -->
    <div class="action-banner" id="action-banner"></div>
  </div>

  <script src="ar-battle.js"></script>
</body>
</html>
