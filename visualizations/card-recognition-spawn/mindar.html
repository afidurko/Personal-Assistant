<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MindAR Card Tracking → 3D Spawn • A-Frame</title>
    <meta name="description" content="Wire MindAR image targets into the same detect → resolve → spawn pipeline.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Stable A-Frame build recommended with MindAR CDN builds -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mind-ar.prod.v1.min.js"></script>
    <script src="components/card-catalog.js"></script>
    <script src="components/card-detector.js"></script>
    <script src="components/procedural-creature.js"></script>
    <script src="components/character-spawner.js"></script>
    <script src="components/battle-arena.js"></script>
    <script src="components/recognition-pipeline.js"></script>
    <script src="components/mindar-bridge.js"></script>
    <style>
      body { margin: 0; }
      .note {
        position: fixed; z-index: 20; left: 12px; right: 12px; top: 12px;
        background: rgba(0,0,0,0.7); color: #fff; padding: 10px 12px;
        font-family: ui-monospace, monospace; font-size: 12px;
      }
      .note a { color: #7CFFF0; }
    </style>
  </head>
  <body>
    <div class="note">
      MindAR mode needs a compiled <code>targets.mind</code> from your printed card art
      (see README). Until that file exists, use the
      <a href="index.html">lab table demo</a>. Bridge listens for
      <code>targetFound</code> and emits the same <code>card-detected</code> event.
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes"
      card-catalog="src: catalog.json"
      card-detector="mode: external"
      character-spawner="spawnRoot: #spawn-root"
      recognition-pipeline
      mindar-bridge="targetMap: 0:volt-wisp,1:ember-drake,2:tide-finch"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="colorManagement: true; antialias: true"
      cursor="rayOrigin: mouse"
      raycaster="objects: .move-btn">

      <a-entity id="spawn-root"></a-entity>

      <!-- MindAR anchors — empty until targetFound; bridge reports IDs -->
      <a-entity id="target-0" mindar-image-target="targetIndex: 0" class="mindar-target" data-card-id="volt-wisp">
        <a-entity battle-arena position="0 0 0" scale="0.6 0.6 0.6"></a-entity>
      </a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1" class="mindar-target" data-card-id="ember-drake"></a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2" class="mindar-target" data-card-id="tide-finch"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </body>
</html>
