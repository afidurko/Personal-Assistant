name: privacy-guard

# Layer 4 of Cam's personal-information safeguards (docs/PRIVACY_SAFEGUARDS.md).
# Fails any push or pull request that carries personal information, secrets,
# biometric material, or private-memory paths — including the PR title/body.
# Findings are printed as location + rule only, never as content.

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: privacy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pii-guard:
    name: pii-guard (tree, diff, PR text)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan every tracked file
        run: python3 scripts/pii-guard.py --all

      - name: Scan files changed by this pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          python3 scripts/pii-guard.py --diff "origin/${{ github.base_ref }}"

      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/pii-guard.py --text -

      - name: Privacy unit tests
        run: |
          cd scripts && python3 -m unittest test_privacy

      - name: Private-memory paths are not tracked
        run: |
          set -euo pipefail
          leaks="$(git ls-files identity/aaron/local '**/private-memory/**' 'data/runtime/**' | grep -v '\.gitkeep$' || true)"
          if [ -n "$leaks" ]; then
            echo "private paths tracked in git:"; echo "$leaks"; exit 1
          fi
          echo "no private paths tracked"
