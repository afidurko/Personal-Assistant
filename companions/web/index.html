<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cam" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a2228" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Cam — listen & speak</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <header class="brand">
      <img class="face" id="camFace" src="face.jpg" alt="Cam"
           onerror="this.style.display='none'; document.getElementById('faceFallback').hidden=false" />
      <div class="face-fallback" id="faceFallback" hidden aria-hidden="true"></div>
      <div>
        <h1>Cam</h1>
        <p class="tag">soft airy · iPhone &amp; iPad</p>
      </div>
    </header>

    <section class="status" id="status">Starting…</section>
    <p class="hint" id="hint">Enroll Aaron’s voice once, then talk — Cam ignores surrounding conversation.</p>
    <p class="voice-score" id="voiceScore">Not enrolled</p>

    <section class="media">
      <div class="cam-wrap">
        <video id="camPreview" playsinline muted autoplay></video>
        <canvas id="gestureOverlay" class="gesture-overlay" aria-hidden="true"></canvas>
        <span id="gestureGlyph" class="gesture-glyph" hidden title="Engaged — next motion is a command">✋</span>
      </div>
      <p id="gestureStatus" class="gesture-status">Gestures off</p>
      <p id="gestureIntent" class="gesture-intent" aria-live="polite"></p>
      <div class="meters">
        <div class="meter"><span id="micLevel"></span></div>
        <p id="partial" class="partial"></p>
      </div>
    </section>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <section class="controls">
      <button type="button" id="btnMic" class="primary">Enable mic & talk</button>
      <button type="button" id="btnEnroll">Enroll my voice (10s)</button>
      <button type="button" id="btnExport" hidden>Export voice profile</button>
      <button type="button" id="btnImport" hidden>Import voice profile</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
      <button type="button" id="btnCam">Enable camera</button>
      <button type="button" id="btnGestures">Enable gestures</button>
      <button type="button" id="btnStop" disabled>Stop</button>
    </section>

    <form id="textForm" class="text-fallback">
      <input id="textIn" type="text" enterkeyhint="send" placeholder="Or type to Cam…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="voice-gate.js"></script>
  <script src="app.js"></script>
  <script src="gestures.js"></script>
</body>
</html>
