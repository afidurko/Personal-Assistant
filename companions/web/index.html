<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cam — listen & speak</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="stage">
    <header class="brand">
      <img class="face" src="/assets/cam-face.jpg" alt="Cam" />
      <div>
        <h1>Cam</h1>
        <p class="tag">soft airy · listening for Aaron</p>
      </div>
    </header>

    <section class="status" id="status">Starting…</section>

    <section class="media">
      <video id="camPreview" playsinline muted autoplay></video>
      <div class="meters">
        <div class="meter"><span id="micLevel"></span></div>
        <p id="partial" class="partial"></p>
      </div>
    </section>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <section class="controls">
      <button type="button" id="btnMic" class="primary">Enable mic & talk</button>
      <button type="button" id="btnCam">Enable camera</button>
      <button type="button" id="btnStop" disabled>Stop</button>
    </section>

    <form id="textForm" class="text-fallback">
      <input id="textIn" type="text" placeholder="Or type to Cam…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
